# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    # The Adminer release workflow owns both of these: vrana/adminer is pinned
    # exactly and vrana/jush is derived from the submodule commit that Adminer
    # bundles. Letting Dependabot move them independently pushes them out of
    # step with each other in whichever direction it happens to run.
    ignore:
      - dependency-name: "vrana/adminer"
      - dependency-name: "vrana/jush"
